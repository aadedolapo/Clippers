<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viral Clip Finder</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #6ea8fe;
    --good: #4caf7d;
    --bad: #e0616b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 32px 80px; }

  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  input[type=file] {
    flex: 1;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  input[type=file]::file-selector-button {
    padding: 8px 14px;
    margin-right: 12px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #06121f;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #06121f;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }

  #sessions { margin-top: 24px; display: flex; flex-direction: column; gap: 24px; }
  .session {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .session-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    cursor: pointer;
    user-select: none;
  }
  .session-name { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .session-status {
    font-size: 13px;
    color: var(--muted);
  }
  .session-toggle {
    font-size: 11px;
    color: var(--muted);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .session.collapsed .session-toggle { transform: rotate(-90deg); }
  .session.collapsed .session-body { display: none; }
  .compliance-badge {
    display: none;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid transparent;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .compliance-badge.unknown {
    background: rgba(224, 97, 107, 0.12);
    border-color: var(--bad);
    color: var(--bad);
  }
  .compliance-badge.cleared {
    background: rgba(76, 175, 125, 0.12);
    border-color: var(--good);
    color: var(--good);
  }
  .session-error {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(224, 97, 107, 0.12);
    border: 1px solid var(--bad);
    color: var(--bad);
    font-size: 13px;
    display: none;
  }

  .session-clips { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .clip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 14px;
  }
  .clip input[type=checkbox] { margin-top: 4px; width: 18px; height: 18px; }
  .clip-body { flex: 1; min-width: 0; }
  .clip-meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .clip-time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .clip-duration { color: var(--muted); font-size: 13px; }
  .clip-score {
    margin-left: auto;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .clip-reason { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .clip-field {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(110, 168, 254, 0.08);
    border: 1px solid rgba(110, 168, 254, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 6px;
  }
  .clip-field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); flex-shrink: 0; min-width: 34px; }
  .clip-field-text { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; user-select: all; }
  .clip-field-copy {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .clip-field-copy.copied { color: var(--good); border-color: var(--good); }
  .clip-fields { margin-bottom: 8px; }
  .clip-coldopen {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(76, 175, 125, 0.08);
    border: 1px solid rgba(76, 175, 125, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .clip-coldopen-label { display: flex; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
  .clip-coldopen-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--good);
    white-space: nowrap;
  }
  .clip-coldopen-text { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-commentary-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 8px;
    cursor: pointer;
    width: fit-content;
  }
  .clip-style-controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    padding: 8px 10px;
    background: rgba(110, 168, 254, 0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
  }
  .clip-style-select-label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .clip-style-checkbox { display: flex; align-items: center; gap: 5px; color: var(--text); cursor: pointer; }
  .clip-style-controls select {
    padding: 4px 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
  }
  .clip-download-btn, .clip-broll-btn, .clip-mark-posted-btn {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    margin-bottom: 8px;
    margin-right: 8px;
  }
  .clip-broll { margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  .clip-beatplan { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
  .clip-beat-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    background: rgba(110, 168, 254, 0.06);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
  }
  .clip-beat-time { font-variant-numeric: tabular-nums; color: var(--muted); flex-shrink: 0; }
  .clip-beat-type { font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent); flex-shrink: 0; }
  .clip-beat-note { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-broll-pick {
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(110, 168, 254, 0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .clip-broll-checkbox { flex-shrink: 0; }
  .clip-broll-thumb {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .clip-broll-meta { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
  .clip-broll-meta a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .clip-broll-meta a:hover { text-decoration: underline; }
  .clip-broll-query { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin-bottom: 2px; }
  .clip-broll-confidence { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--good); }
  .clip-text {
    font-size: 13px;
    color: var(--text);
    max-height: 4.2em;
    overflow: hidden;
    line-height: 1.4;
  }
  .clip-result { margin-top: 8px; font-size: 12px; }
  .clip-result.ok { color: var(--good); }
  .clip-result.fail { color: var(--bad); }

  .session-send-bar {
    margin-top: 16px;
    display: none;
    align-items: center;
    gap: 12px;
  }
  .session-send-bar span { color: var(--muted); font-size: 13px; }

  .shortlist-panel {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 24px;
    background: rgba(110, 168, 254, 0.04);
  }
  .shortlist-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .shortlist-header h2 { font-size: 16px; margin: 0; flex: 1; }
  .shortlist-header input[type=date] {
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
  }
  .shortlist-picks { display: flex; flex-direction: column; gap: 10px; }
  .shortlist-pick {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .shortlist-pick-meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .shortlist-pick-lane {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    color: var(--accent);
    background: rgba(110, 168, 254, 0.12);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .shortlist-pick-score { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .shortlist-pick-video { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .shortlist-pick-hook { font-weight: 600; margin-bottom: 4px; }
  .shortlist-pick-firstline { color: var(--muted); font-size: 13px; font-style: italic; margin-bottom: 10px; }
  .shortlist-send-btn {
    padding: 6px 14px;
    font-size: 13px;
  }
  .shortlist-send-result { margin-left: 10px; font-size: 12px; }
  .shortlist-empty { color: var(--muted); font-size: 14px; }
  .csv-import-label {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .clip-performance {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .clip-performance-stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .clip-performance-stats input {
    width: 90px;
    padding: 5px 8px;
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
  }
  .clip-performance-save {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .clip-performance-result { font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Viral Clip Finder</h1>
  <p>Upload one or more videos, get ranked clip candidates for each, send picks to DaVinci Resolve.</p>
</header>

<main>
  <div class="shortlist-panel">
    <div class="shortlist-header">
      <h2>Today's picks</h2>
      <input type="date" id="shortlist-date" />
      <button type="button" id="shortlist-refresh" class="secondary">Refresh</button>
      <label class="csv-import-label" for="performance-csv-input">Import Studio CSV</label>
      <input type="file" id="performance-csv-input" accept=".csv" style="display: none;" />
      <span id="performance-csv-result" style="font-size: 12px; color: var(--muted);"></span>
    </div>
    <div id="shortlist-picks" class="shortlist-picks"></div>
  </div>

  <div class="row">
    <input type="file" id="local-file-input" accept="video/*" multiple />
    <input type="text" id="local-title-input" placeholder="Title (optional, single file only)" style="flex: 0 0 220px;" />
    <input type="text" id="local-source-input" placeholder="Church/speaker (optional, single file only)" style="flex: 0 0 220px;" />
    <button id="analyze-btn">Analyze</button>
  </div>
  <p style="margin-top: 10px; font-size: 13px; color: var(--muted);">Select one or more video files to queue them all at once. Source is logged per video for future permission outreach and claim tracing.</p>

  <div id="sessions"></div>
</main>

<script>
const analyzeBtn = document.getElementById("analyze-btn");
const localFileInput = document.getElementById("local-file-input");
const localTitleInput = document.getElementById("local-title-input");
const localSourceInput = document.getElementById("local-source-input");
const sessionsEl = document.getElementById("sessions");

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function downloadClipText(clip, index) {
  const lines = [];
  if (clip.seo_title) lines.push(`Title: ${clip.seo_title}`);
  if (clip.hook) lines.push(`Hook: ${clip.hook}`);
  if (clip.seo_description) lines.push(`Description: ${clip.seo_description}`);
  if (lines.length === 0) return;

  const blob = new Blob([lines.join("\n\n") + "\n"], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `clip_${index + 1}_${fmtTime(clip.start).replace(":", "m")}s.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Each session (whether freshly analyzed or restored from disk) owns one
// video end-to-end (poll/render its own clip list, send its own selections
// to Resolve) via closures scoped to that session's DOM block — independent
// of every other session, so multiple videos can be queued and worked on at
// once, and past sessions survive a page refresh.
function createSession(name, insertAt) {
  const root = document.createElement("div");
  root.className = "session";
  root.innerHTML = `
    <div class="session-header">
      <span class="session-toggle">▾</span>
      <h2 class="session-name">${escapeHtml(name)}</h2>
      <span class="compliance-badge unknown" title="Click to toggle copyright status">⚠️ Copyright: unknown</span>
      <span class="session-status">Starting…</span>
    </div>
    <div class="session-body">
      <div class="session-error"></div>
      <div class="session-clips"></div>
      <div class="session-send-bar">
        <button type="button" class="session-send-btn">Send to Resolve</button>
        <span class="session-send-count"></span>
      </div>
    </div>
  `;
  if (insertAt === "end") {
    sessionsEl.appendChild(root);
  } else {
    sessionsEl.prepend(root);
  }

  root.querySelector(".session-header").addEventListener("click", () => {
    root.classList.toggle("collapsed");
  });

  const nameEl = root.querySelector(".session-name");
  const statusEl = root.querySelector(".session-status");
  const errorEl = root.querySelector(".session-error");
  const clipsEl = root.querySelector(".session-clips");
  const sendBar = root.querySelector(".session-send-bar");
  const sendBtn = root.querySelector(".session-send-btn");
  const sendCount = root.querySelector(".session-send-count");
  const complianceEl = root.querySelector(".compliance-badge");

  let videoId = null;
  let clips = [];

  // PRD §14 compliance layer: always renders as a warning until a human
  // explicitly clicks it to mark the source cleared — the system itself
  // never sets this to "cleared".
  function setComplianceStatus(status) {
    const s = status === "cleared" ? "cleared" : "unknown";
    complianceEl.dataset.status = s;
    complianceEl.className = `compliance-badge ${s}`;
    complianceEl.textContent = s === "cleared" ? "✅ Copyright: cleared" : "⚠️ Copyright: unknown";
    complianceEl.style.display = "inline-flex";
  }

  complianceEl.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!videoId) return;
    const next = complianceEl.dataset.status === "cleared" ? "unknown" : "cleared";
    complianceEl.style.opacity = "0.6";
    try {
      const res = await fetch(`/copyright-status/${videoId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: next }),
      });
      if (!res.ok) throw new Error(`copyright status update failed (${res.status})`);
      const data = await res.json();
      setComplianceStatus(data.copyright_status);
    } catch (err) {
      setError(err.message);
    } finally {
      complianceEl.style.opacity = "1";
    }
  });

  function setError(msg) {
    if (!msg) {
      errorEl.style.display = "none";
      errorEl.textContent = "";
      return;
    }
    errorEl.style.display = "block";
    errorEl.textContent = msg;
  }

  function selectedCheckboxes() {
    return Array.from(clipsEl.querySelectorAll(".clip-checkbox")).filter((c) => c.checked);
  }

  function updateSendBar() {
    const n = selectedCheckboxes().length;
    sendBar.style.display = n > 0 ? "flex" : "none";
    sendCount.textContent = n === 1 ? "1 clip selected" : `${n} clips selected`;
  }

  function renderClips() {
    clipsEl.innerHTML = "";
    if (clips.length === 0) {
      clipsEl.innerHTML = `<div style="color: var(--muted); font-size: 14px;">No candidate clips found.</div>`;
      return;
    }

    const copyFields = [
      { key: "hook", label: "Hook" },
      { key: "seo_title", label: "Title" },
      { key: "seo_description", label: "Desc" },
    ];

    clips.forEach((clip, i) => {
      const duration = clip.end - clip.start;
      const el = document.createElement("div");
      el.className = "clip";
      el.dataset.index = i;
      const fieldsHtml = copyFields
        .filter((f) => clip[f.key])
        .map(
          (f) => `
          <div class="clip-field" data-field="${f.key}">
            <span class="clip-field-label">${f.label}</span>
            <span class="clip-field-text">${escapeHtml(clip[f.key])}</span>
            <button type="button" class="clip-field-copy">Copy</button>
          </div>`
        )
        .join("");
      el.innerHTML = `
        <input type="checkbox" class="clip-checkbox" />
        <div class="clip-body">
          <div class="clip-meta">
            <span class="clip-time">${fmtTime(clip.start)} – ${fmtTime(clip.end)}</span>
            <span class="clip-duration">${duration.toFixed(1)}s</span>
            <span class="clip-score">${(clip.score * 10).toFixed(1)}/10</span>
          </div>
          <div class="clip-reason">${escapeHtml(clip.reason)}</div>
          ${clip.cold_open ? `
          <div class="clip-coldopen">
            <label class="clip-coldopen-label">
              <input type="checkbox" class="clip-coldopen-checkbox" checked />
              <span class="clip-coldopen-badge">⚡ Cold open</span>
            </label>
            <span class="clip-coldopen-text">"${escapeHtml(clip.cold_open.text)}"</span>
          </div>` : ""}
          <label class="clip-commentary-label">
            <input type="checkbox" class="clip-commentary-checkbox" />
            Add Wisement outro
          </label>
          <div class="clip-style-controls">
            <label class="clip-style-select-label">
              Clip style
              <select class="clip-caption-preset">
                <option value="minimal-faith" selected>Minimal Faith (zoom/grade/music bundle)</option>
                <option value="bold-white">Plain (cold-open eligible)</option>
              </select>
            </label>
            <label class="clip-style-checkbox"><input type="checkbox" class="clip-zoom-opener-checkbox" checked /> Zoom-out opener</label>
            <label class="clip-style-checkbox"><input type="checkbox" class="clip-bw-grade-checkbox" /> B&amp;W grade</label>
            <label class="clip-style-checkbox"><input type="checkbox" class="clip-music-bed-checkbox" /> Music bed</label>
            <select class="clip-music-mood">
              <option value="slow" selected>Slow</option>
              <option value="cinematic">Cinematic</option>
            </select>
          </div>
          <div class="clip-fields">${fieldsHtml}</div>
          ${fieldsHtml ? '<button type="button" class="clip-download-btn">Download title/hook/desc</button>' : ""}
          <button type="button" class="clip-broll-btn">Suggest B-roll</button>
          <div class="clip-broll"></div>
          <button type="button" class="clip-beatplan-btn">Suggest beat plan</button>
          <div class="clip-beatplan"></div>
          <div class="clip-text">${escapeHtml(clip.text)}</div>
          <div class="clip-performance">
            <button type="button" class="clip-mark-posted-btn">Mark as posted</button>
            <div class="clip-performance-stats" style="display: none;">
              <input type="number" class="clip-perf-stayed" placeholder="Stayed %" min="0" max="100" step="1" />
              <input type="number" class="clip-perf-views48" placeholder="Views 48h" min="0" step="1" />
              <input type="number" class="clip-perf-views7d" placeholder="Views 7d" min="0" step="1" />
              <input type="number" class="clip-perf-likes" placeholder="Likes" min="0" step="1" />
              <input type="number" class="clip-perf-subs" placeholder="Subs gained" min="0" step="1" />
              <button type="button" class="clip-performance-save">Save stats</button>
              <span class="clip-performance-result"></span>
            </div>
          </div>
          <div class="clip-result"></div>
        </div>
      `;
      const downloadBtn = el.querySelector(".clip-download-btn");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", () => downloadClipText(clip, i));
      }

      const markPostedBtn = el.querySelector(".clip-mark-posted-btn");
      const perfStatsEl = el.querySelector(".clip-performance-stats");
      const perfResultEl = el.querySelector(".clip-performance-result");
      markPostedBtn.addEventListener("click", async () => {
        const url = window.prompt("YouTube URL for this clip:");
        if (!url) return;
        markPostedBtn.disabled = true;
        try {
          const res = await fetch("/performance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ video_id: videoId, start: clip.start, end: clip.end, youtube_url: url }),
          });
          if (!res.ok) throw new Error(`mark as posted failed (${res.status})`);
          markPostedBtn.textContent = "Posted ✓";
          perfStatsEl.style.display = "flex";
          perfStatsEl.style.flexWrap = "wrap";
        } catch (e) {
          perfResultEl.style.color = "var(--bad)";
          perfResultEl.textContent = e.message;
        } finally {
          markPostedBtn.disabled = false;
        }
      });

      const perfSaveBtn = el.querySelector(".clip-performance-save");
      perfSaveBtn.addEventListener("click", async () => {
        const numOrNull = (val) => (val === "" ? null : Number(val));
        const body = {
          video_id: videoId,
          start: clip.start,
          end: clip.end,
          stayed_to_watch_pct: numOrNull(el.querySelector(".clip-perf-stayed").value),
          views_48h: numOrNull(el.querySelector(".clip-perf-views48").value),
          views_7d: numOrNull(el.querySelector(".clip-perf-views7d").value),
          likes: numOrNull(el.querySelector(".clip-perf-likes").value),
          subs_gained: numOrNull(el.querySelector(".clip-perf-subs").value),
        };
        perfSaveBtn.disabled = true;
        try {
          const res = await fetch("/performance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok) throw new Error(`save stats failed (${res.status})`);
          perfResultEl.style.color = "var(--good)";
          perfResultEl.textContent = "Saved";
        } catch (e) {
          perfResultEl.style.color = "var(--bad)";
          perfResultEl.textContent = e.message;
        } finally {
          perfSaveBtn.disabled = false;
        }
      });

      const brollBtn = el.querySelector(".clip-broll-btn");
      const brollEl = el.querySelector(".clip-broll");
      brollBtn.addEventListener("click", async () => {
        brollBtn.disabled = true;
        brollBtn.textContent = "Searching…";
        brollEl.innerHTML = "";
        try {
          const res = await fetch(`/broll/${videoId}/${i}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ beat_plan: clip.beatPlan || [] }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.detail || `B-roll search failed (${res.status})`);
          if (!data.picks || data.picks.length === 0) {
            brollEl.innerHTML = `<div style="color: var(--muted); font-size: 12px;">No B-roll candidates found.</div>`;
          } else {
            clip.brollPicks = data.picks;
            brollEl.innerHTML = data.picks
              .map((p, pi) => {
                const thumb = p.thumbnail_url
                  ? `<img class="clip-broll-thumb" src="${escapeHtml(p.thumbnail_url)}" alt="" />`
                  : `<div class="clip-broll-thumb"></div>`;
                const confidence = p.confidence != null ? `${p.confidence}%` : "unscored";
                const timing = p.offset != null ? `${p.offset.toFixed(1)}s in` : "timing unmatched — will play at clip start";
                return `
                  <div class="clip-broll-pick">
                    <input type="checkbox" class="clip-broll-checkbox" data-pick-index="${pi}" />
                    ${thumb}
                    <div class="clip-broll-meta">
                      <div class="clip-broll-query">${escapeHtml(p.query)} · ${escapeHtml(p.provider)} · ${escapeHtml(timing)}</div>
                      <a href="${escapeHtml(p.page_url)}" target="_blank" rel="noopener">View source</a>
                      — <span class="clip-broll-confidence">${confidence}</span>
                      <div>${escapeHtml(p.reason || "")}</div>
                    </div>
                  </div>`;
              })
              .join("");
          }
        } catch (e) {
          brollEl.innerHTML = `<div style="color: var(--bad); font-size: 12px;">${escapeHtml(e.message)}</div>`;
        } finally {
          brollBtn.disabled = false;
          brollBtn.textContent = "Suggest B-roll";
        }
      });

      const beatPlanBtn = el.querySelector(".clip-beatplan-btn");
      const beatPlanEl = el.querySelector(".clip-beatplan");
      beatPlanBtn.addEventListener("click", async () => {
        beatPlanBtn.disabled = true;
        beatPlanBtn.textContent = "Planning…";
        beatPlanEl.innerHTML = "";
        try {
          const res = await fetch(`/beat-plan/${videoId}/${i}`, { method: "POST" });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.detail || `Beat plan generation failed (${res.status})`);
          if (!data.beat_plan || data.beat_plan.length === 0) {
            beatPlanEl.innerHTML = `<div style="color: var(--muted); font-size: 12px;">No beat plan generated.</div>`;
          } else {
            clip.beatPlan = data.beat_plan;
            beatPlanEl.innerHTML = data.beat_plan
              .map((b) => {
                const relStart = (b.start - clip.start).toFixed(1);
                const relEnd = (b.end - clip.start).toFixed(1);
                const detail = b.note || b.emphasis_word || "";
                return `
                  <div class="clip-beat-row">
                    <span class="clip-beat-time">${relStart}-${relEnd}s</span>
                    <span class="clip-beat-type">${escapeHtml(b.beat_type)}</span>
                    <span class="clip-beat-note">${escapeHtml(detail)}</span>
                  </div>`;
              })
              .join("");
          }
        } catch (e) {
          beatPlanEl.innerHTML = `<div style="color: var(--bad); font-size: 12px;">${escapeHtml(e.message)}</div>`;
        } finally {
          beatPlanBtn.disabled = false;
          beatPlanBtn.textContent = "Suggest beat plan";
        }
      });

      el.querySelectorAll(".clip-field").forEach((fieldEl) => {
        const value = clip[fieldEl.dataset.field];
        const copyBtn = fieldEl.querySelector(".clip-field-copy");
        copyBtn.addEventListener("click", () => {
          navigator.clipboard.writeText(value).then(() => {
            copyBtn.textContent = "Copied";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = "Copy";
              copyBtn.classList.remove("copied");
            }, 1500);
          });
        });
      });
      el.querySelector(".clip-checkbox").addEventListener("change", updateSendBar);
      clipsEl.appendChild(el);
    });

    updateSendBar();
  }

  function poll(jobId) {
    const handle = setInterval(async () => {
      try {
        const res = await fetch(`/status/${jobId}`);
        if (!res.ok) throw new Error(`status request failed (${res.status})`);
        const data = await res.json();

        if (data.status === "error") {
          clearInterval(handle);
          statusEl.textContent = "Error";
          setError(data.error || "Analysis failed.");
          return;
        }

        if (data.status === "done") {
          clearInterval(handle);
          statusEl.textContent = "Done";
          nameEl.textContent = data.title;
          videoId = data.video_id;
          clips = data.clips;
          setComplianceStatus(data.copyright_status);
          renderClips();
          return;
        }

        statusEl.textContent = data.status + "…";
      } catch (e) {
        clearInterval(handle);
        statusEl.textContent = "Error";
        setError(e.message);
      }
    }, 2000);
  }

  sendBtn.addEventListener("click", async () => {
    const selected = selectedCheckboxes();
    if (selected.length === 0) return;

    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    const selectedClips = selected.map((cb) => {
      const clipEl = cb.closest(".clip");
      const idx = Number(clipEl.dataset.index);
      const clip = clips[idx];
      const checkedBrollBoxes = Array.from(clipEl.querySelectorAll(".clip-broll-checkbox")).filter((c) => c.checked);
      const broll = checkedBrollBoxes.map((bc) => {
        const p = clip.brollPicks[Number(bc.dataset.pickIndex)];
        return {
          provider: p.provider,
          id: p.id != null ? String(p.id) : null,
          preview_url: p.preview_url,
          query: p.query,
          offset: p.offset,
          duration: p.duration,
        };
      });
      const beat_plan = (clip.beatPlan || []).map((b) => ({
        beat_type: b.beat_type,
        start: b.start,
        end: b.end,
        note: b.note || null,
        emphasis_word: b.emphasis_word || null,
      }));
      const coldOpenCheckbox = clipEl.querySelector(".clip-coldopen-checkbox");
      const use_cold_open = coldOpenCheckbox ? coldOpenCheckbox.checked : true;
      const with_commentary = clipEl.querySelector(".clip-commentary-checkbox").checked;
      const caption_preset = clipEl.querySelector(".clip-caption-preset").value;
      const zoom_opener = clipEl.querySelector(".clip-zoom-opener-checkbox").checked;
      const bw_grade = clipEl.querySelector(".clip-bw-grade-checkbox").checked;
      const music_bed = clipEl.querySelector(".clip-music-bed-checkbox").checked;
      const music_mood = clipEl.querySelector(".clip-music-mood").value;
      return {
        start: clip.start, end: clip.end, broll, beat_plan, use_cold_open, with_commentary,
        caption_preset, zoom_opener, bw_grade, music_bed, music_mood,
      };
    });

    try {
      const res = await fetch("/send-to-resolve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ video_id: videoId, clips: selectedClips }),
      });
      if (!res.ok) throw new Error(`send-to-resolve failed (${res.status})`);
      const { results } = await res.json();

      selected.forEach((cb, i) => {
        const resultEl = cb.closest(".clip").querySelector(".clip-result");
        const r = results[i];
        if (r.success) {
          resultEl.className = "clip-result ok";
          const mp4Note = r.captioned_mp4 ? ` — captioned mp4: ${escapeHtml(r.captioned_mp4)}` : "";
          resultEl.innerHTML = `Sent to Resolve${mp4Note}`;
        } else {
          resultEl.className = "clip-result fail";
          resultEl.textContent = `Failed: ${r.error}`;
        }
      });
    } catch (e) {
      setError(e.message);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send to Resolve";
    }
  });

  return {
    setName: (name) => { nameEl.textContent = name; },
    setStatus: (text) => { statusEl.textContent = text; },
    setError,
    setDone: (id, clipList, copyrightStatus) => {
      videoId = id;
      clips = clipList;
      setComplianceStatus(copyrightStatus);
      renderClips();
    },
    poll,
  };
}

// Kicks off a brand-new upload → analyze → poll flow for a freshly selected file.
function startSession(file, titleOverride, sourceOverride) {
  const session = createSession(file.name, "start");
  session.setStatus("Starting…");

  (async () => {
    try {
      session.setStatus("Uploading…");
      const form = new FormData();
      form.append("file", file);
      const uploadRes = await fetch("/upload", { method: "POST", body: form });
      if (!uploadRes.ok) throw new Error(`upload failed (${uploadRes.status})`);
      const { local_file, title } = await uploadRes.json();
      const body = { local_file, title: titleOverride || title, source: sourceOverride || undefined };
      session.setName(body.title);

      session.setStatus("Starting…");
      const res = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`analyze request failed (${res.status})`);
      const { job_id } = await res.json();
      session.poll(job_id);
    } catch (e) {
      session.setStatus("Error");
      session.setError(e.message);
    }
  })();
}

// Rebuilds a session's UI straight from previously saved hook/title/description
// data — no re-upload or re-analysis — so a browser refresh doesn't lose it.
function restoreSession(saved) {
  const session = createSession(saved.title, "end");
  session.setStatus("Restored");
  session.setDone(saved.video_id, saved.clips, saved.copyright_status);
}

async function loadSavedSessions() {
  try {
    const res = await fetch("/saved-clips");
    if (!res.ok) return;
    const { sessions } = await res.json();
    sessions.forEach(restoreSession);
  } catch (e) {
    console.error("Failed to load saved clips", e);
  }
}

function analyze() {
  const files = Array.from(localFileInput.files);
  if (files.length === 0) return;
  const singleTitle = files.length === 1 ? localTitleInput.value.trim() : "";
  const singleSource = files.length === 1 ? localSourceInput.value.trim() : "";
  files.forEach((file) => startSession(file, singleTitle, singleSource));
  localFileInput.value = "";
  localTitleInput.value = "";
  localSourceInput.value = "";
}

// "Today's picks" (retention upgrade plan phase 4): the day's actual best
// 1-2 clips ranked across every video analyzed that day, not a per-video
// top N — reusing the same /send-to-resolve endpoint each session's own
// send button uses.
const shortlistDateInput = document.getElementById("shortlist-date");
const shortlistRefreshBtn = document.getElementById("shortlist-refresh");
const shortlistPicksEl = document.getElementById("shortlist-picks");

function todayLocalDateStr() {
  const d = new Date();
  const tzOffsetMs = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tzOffsetMs).toISOString().slice(0, 10);
}

function renderShortlist(data) {
  if (!data.picks || data.picks.length === 0) {
    shortlistPicksEl.innerHTML = `<div class="shortlist-empty">No picks yet for this date — analyze some videos first.</div>`;
    return;
  }
  shortlistPicksEl.innerHTML = data.picks
    .map((c) => {
      const sc = c.scorecard || {};
      return `
        <div class="shortlist-pick" data-video-id="${escapeHtml(c.video_id)}" data-start="${c.start}" data-end="${c.end}">
          <div class="shortlist-pick-meta">
            <span class="shortlist-pick-lane">${escapeHtml(sc.lane || "other")}</span>
            <span class="shortlist-pick-score">${(c.score * 10).toFixed(1)}/10</span>
            <span class="shortlist-pick-video">${escapeHtml(c.title)} · ${fmtTime(c.start)}–${fmtTime(c.end)} (${c.duration}s)</span>
          </div>
          <div class="shortlist-pick-hook">${escapeHtml(c.hook || "")}</div>
          <div class="shortlist-pick-firstline">"${escapeHtml(sc.hook_first_line || "")}"</div>
          <button type="button" class="shortlist-send-btn">Send to Resolve</button>
          <span class="shortlist-send-result"></span>
        </div>`;
    })
    .join("");

  shortlistPicksEl.querySelectorAll(".shortlist-send-btn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const pickEl = btn.closest(".shortlist-pick");
      const resultEl = pickEl.querySelector(".shortlist-send-result");
      const video_id = pickEl.dataset.videoId;
      const start = Number(pickEl.dataset.start);
      const end = Number(pickEl.dataset.end);

      btn.disabled = true;
      btn.textContent = "Sending…";
      resultEl.textContent = "";
      try {
        const res = await fetch("/send-to-resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ video_id, clips: [{ start, end }] }),
        });
        if (!res.ok) throw new Error(`send-to-resolve failed (${res.status})`);
        const { results } = await res.json();
        const r = results[0];
        resultEl.style.color = r.success ? "var(--good)" : "var(--bad)";
        resultEl.textContent = r.success ? "Sent to Resolve" : `Failed: ${r.error}`;
      } catch (e) {
        resultEl.style.color = "var(--bad)";
        resultEl.textContent = e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Send to Resolve";
      }
    });
  });
}

async function loadShortlist() {
  const date = shortlistDateInput.value || todayLocalDateStr();
  shortlistPicksEl.innerHTML = `<div class="shortlist-empty">Loading…</div>`;
  try {
    const res = await fetch(`/shortlist?date=${encodeURIComponent(date)}&n=2`);
    if (!res.ok) throw new Error(`shortlist request failed (${res.status})`);
    renderShortlist(await res.json());
  } catch (e) {
    shortlistPicksEl.innerHTML = `<div class="shortlist-empty" style="color: var(--bad);">${escapeHtml(e.message)}</div>`;
  }
}

shortlistDateInput.value = todayLocalDateStr();
shortlistRefreshBtn.addEventListener("click", loadShortlist);
shortlistDateInput.addEventListener("change", loadShortlist);

// Performance CSV import (retention upgrade plan phase 5): a YouTube
// Studio Shorts export, matched server-side to already-posted clips.
const performanceCsvInput = document.getElementById("performance-csv-input");
const performanceCsvResult = document.getElementById("performance-csv-result");
performanceCsvInput.addEventListener("change", async () => {
  const file = performanceCsvInput.files[0];
  if (!file) return;
  performanceCsvResult.textContent = "Importing…";
  try {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/performance/import-csv", { method: "POST", body: form });
    if (!res.ok) throw new Error(`import failed (${res.status})`);
    const { matched, unmatched } = await res.json();
    performanceCsvResult.textContent = `Matched ${matched}, unmatched ${unmatched}`;
  } catch (e) {
    performanceCsvResult.textContent = e.message;
  } finally {
    performanceCsvInput.value = "";
  }
});

loadSavedSessions();
loadShortlist();

analyzeBtn.addEventListener("click", analyze);
</script>
