<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viral Clip Finder</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #6ea8fe;
    --good: #4caf7d;
    --bad: #e0616b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 32px 80px; }

  .row { display: flex; gap: 8px; align-items: center; }
  input[type=url], input[type=text] {
    flex: 1;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  input[type=file] {
    flex: 1;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  input[type=file]::file-selector-button {
    padding: 8px 14px;
    margin-right: 12px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #06121f;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #06121f;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }

  #status-line {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  #error-box {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(224, 97, 107, 0.12);
    border: 1px solid var(--bad);
    color: var(--bad);
    font-size: 13px;
    display: none;
  }

  #clips { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .clip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 14px;
  }
  .clip input[type=checkbox] { margin-top: 4px; width: 18px; height: 18px; }
  .clip-body { flex: 1; min-width: 0; }
  .clip-meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .clip-time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .clip-duration { color: var(--muted); font-size: 13px; }
  .clip-score {
    margin-left: auto;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .clip-reason { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .clip-hook {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(110, 168, 254, 0.08);
    border: 1px solid rgba(110, 168, 254, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 8px;
  }
  .clip-hook-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); flex-shrink: 0; }
  .clip-hook-text { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; user-select: all; }
  .clip-hook-copy {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .clip-hook-copy.copied { color: var(--good); border-color: var(--good); }
  .clip-text {
    font-size: 13px;
    color: var(--text);
    max-height: 4.2em;
    overflow: hidden;
    line-height: 1.4;
  }
  .clip-result { margin-top: 8px; font-size: 12px; }
  .clip-result.ok { color: var(--good); }
  .clip-result.fail { color: var(--bad); }

  #send-bar {
    margin-top: 20px;
    display: none;
    align-items: center;
    gap: 12px;
  }
  #send-bar span { color: var(--muted); font-size: 13px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Viral Clip Finder</h1>
  <p>Paste a YouTube URL, get ranked clip candidates, send picks to DaVinci Resolve.</p>
</header>

<main>
  <div class="row">
    <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=..." />
    <input type="file" id="local-file-input" class="hidden" accept="video/*" />
    <input type="text" id="local-title-input" class="hidden" placeholder="Title (optional)" style="flex: 0 0 220px;" />
    <button id="analyze-btn">Analyze</button>
  </div>
  <label style="display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--muted); cursor: pointer;">
    <input type="checkbox" id="local-file-toggle" />
    Upload a local file instead of a YouTube URL (e.g. downloaded via a third-party tool for higher quality)
  </label>
  <div id="status-line"></div>
  <div id="error-box"></div>

  <div id="clips"></div>

  <div id="send-bar">
    <button id="send-btn">Send to Resolve</button>
    <span id="send-count"></span>
  </div>
</main>

<script>
const analyzeBtn = document.getElementById("analyze-btn");
const urlInput = document.getElementById("url-input");
const localFileInput = document.getElementById("local-file-input");
const localTitleInput = document.getElementById("local-title-input");
const localFileToggle = document.getElementById("local-file-toggle");
const statusLine = document.getElementById("status-line");
const errorBox = document.getElementById("error-box");
const clipsEl = document.getElementById("clips");
const sendBar = document.getElementById("send-bar");
const sendBtn = document.getElementById("send-btn");
const sendCount = document.getElementById("send-count");

let currentVideoId = null;
let currentClips = [];
let pollHandle = null;

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

function setError(msg) {
  if (!msg) {
    errorBox.style.display = "none";
    errorBox.textContent = "";
    return;
  }
  errorBox.style.display = "block";
  errorBox.textContent = msg;
}

function setBusy(busy) {
  analyzeBtn.disabled = busy;
  urlInput.disabled = busy;
  localFileInput.disabled = busy;
  localTitleInput.disabled = busy;
}

localFileToggle.addEventListener("change", () => {
  const useLocal = localFileToggle.checked;
  urlInput.classList.toggle("hidden", useLocal);
  localFileInput.classList.toggle("hidden", !useLocal);
  localTitleInput.classList.toggle("hidden", !useLocal);
});

async function analyze() {
  const useLocal = localFileToggle.checked;
  const url = urlInput.value.trim();
  const file = localFileInput.files[0];
  if (useLocal ? !file : !url) return;

  setError(null);
  clipsEl.innerHTML = "";
  sendBar.style.display = "none";
  setBusy(true);
  statusLine.textContent = useLocal ? "Uploading..." : "Starting...";

  try {
    let body;
    if (useLocal) {
      const form = new FormData();
      form.append("file", file);
      const uploadRes = await fetch("/upload", { method: "POST", body: form });
      if (!uploadRes.ok) throw new Error(`upload failed (${uploadRes.status})`);
      const { local_file, title } = await uploadRes.json();
      body = { local_file, title: localTitleInput.value.trim() || title };
      statusLine.textContent = "Starting...";
    } else {
      body = { url };
    }

    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`analyze request failed (${res.status})`);
    const { job_id } = await res.json();
    poll(job_id);
  } catch (e) {
    setBusy(false);
    setError(e.message);
    statusLine.textContent = "";
  }
}

function poll(jobId) {
  if (pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(async () => {
    try {
      const res = await fetch(`/status/${jobId}`);
      if (!res.ok) throw new Error(`status request failed (${res.status})`);
      const data = await res.json();

      if (data.status === "error") {
        clearInterval(pollHandle);
        setBusy(false);
        statusLine.textContent = "";
        setError(data.error || "Analysis failed.");
        return;
      }

      if (data.status === "done") {
        clearInterval(pollHandle);
        setBusy(false);
        statusLine.textContent = `Done — ${data.title}`;
        currentVideoId = data.video_id;
        currentClips = data.clips;
        renderClips(data.clips);
        return;
      }

      statusLine.textContent = `Status: ${data.status}...`;
    } catch (e) {
      clearInterval(pollHandle);
      setBusy(false);
      setError(e.message);
    }
  }, 2000);
}

function renderClips(clips) {
  clipsEl.innerHTML = "";
  if (clips.length === 0) {
    clipsEl.innerHTML = `<div style="color: var(--muted); font-size: 14px;">No candidate clips found.</div>`;
    return;
  }

  clips.forEach((clip, i) => {
    const duration = clip.end - clip.start;
    const el = document.createElement("div");
    el.className = "clip";
    el.dataset.index = i;
    el.innerHTML = `
      <input type="checkbox" class="clip-checkbox" />
      <div class="clip-body">
        <div class="clip-meta">
          <span class="clip-time">${fmtTime(clip.start)} – ${fmtTime(clip.end)}</span>
          <span class="clip-duration">${duration.toFixed(1)}s</span>
          <span class="clip-score">${(clip.score * 10).toFixed(1)}/10</span>
        </div>
        <div class="clip-reason">${escapeHtml(clip.reason)}</div>
        ${clip.hook ? `
        <div class="clip-hook">
          <span class="clip-hook-label">Hook</span>
          <span class="clip-hook-text">${escapeHtml(clip.hook)}</span>
          <button type="button" class="clip-hook-copy">Copy</button>
        </div>` : ""}
        <div class="clip-text">${escapeHtml(clip.text)}</div>
        <div class="clip-result"></div>
      </div>
    `;
    const copyBtn = el.querySelector(".clip-hook-copy");
    if (copyBtn) {
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(clip.hook).then(() => {
          copyBtn.textContent = "Copied";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }, 1500);
        });
      });
    }
    el.querySelector(".clip-checkbox").addEventListener("change", updateSendBar);
    clipsEl.appendChild(el);
  });

  updateSendBar();
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function selectedCheckboxes() {
  return Array.from(document.querySelectorAll(".clip-checkbox")).filter((c) => c.checked);
}

function updateSendBar() {
  const n = selectedCheckboxes().length;
  sendBar.style.display = n > 0 ? "flex" : "none";
  sendCount.textContent = n === 1 ? "1 clip selected" : `${n} clips selected`;
}

async function sendToResolve() {
  const selected = selectedCheckboxes();
  if (selected.length === 0) return;

  sendBtn.disabled = true;
  sendBtn.textContent = "Sending...";

  const clips = selected.map((cb) => {
    const idx = Number(cb.closest(".clip").dataset.index);
    return { start: currentClips[idx].start, end: currentClips[idx].end };
  });

  try {
    const res = await fetch("/send-to-resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ video_id: currentVideoId, clips }),
    });
    if (!res.ok) throw new Error(`send-to-resolve failed (${res.status})`);
    const { results } = await res.json();

    selected.forEach((cb, i) => {
      const resultEl = cb.closest(".clip").querySelector(".clip-result");
      const r = results[i];
      if (r.success) {
        resultEl.className = "clip-result ok";
        resultEl.textContent = `Sent to Resolve${r.captioned_mp4 ? ` — captioned mp4: ${r.captioned_mp4}` : ""}`;
      } else {
        resultEl.className = "clip-result fail";
        resultEl.textContent = `Failed: ${r.error}`;
      }
    });
  } catch (e) {
    setError(e.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Send to Resolve";
  }
}

analyzeBtn.addEventListener("click", analyze);
urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
sendBtn.addEventListener("click", sendToResolve);
</script>
</body>
</html>
