<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #6ea8fe;
    --good: #4caf7d;
    --bad: #e0616b;
    --warn: #e0b45c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 20px; margin: 0; }
  header a { color: var(--accent); font-size: 14px; text-decoration: none; }
  .watch { margin-left: auto; font-size: 13px; color: var(--muted); }
  .watch b { color: var(--text); font-weight: 500; }

  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 66px); }
  aside { border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  aside h2, .feed-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }

  .start { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  select, button {
    font: inherit; font-size: 13px; padding: 9px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button { background: var(--accent); color: #06121f; border: none; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }

  .jobs { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .job {
    text-align: left; background: var(--panel); color: var(--text); font-weight: 400;
    border: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .job.active { border-color: var(--accent); }
  .job .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .s { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.running { animation: pulse 1.2s ease-in-out infinite; }
  .dot.done { background: var(--good); }
  .dot.error { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .25; } }
  .empty { color: var(--muted); font-size: 13px; }

  section.feed { padding: 16px 32px 80px; max-width: 900px; width: 100%; }
  .feed-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .feed-head .title { font-size: 16px; font-weight: 600; }
  .ev { display: grid; grid-template-columns: 56px 92px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.45; }
  .ev .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .ev .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 3px; color: var(--muted); }
  .ev .body { white-space: pre-wrap; word-break: break-word; }
  .ev.stage .kind { color: var(--accent); }
  .ev.thinking .body { color: var(--muted); font-style: italic; }
  .ev.tool .kind { color: var(--warn); }
  .ev.tool .body { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .ev.result .body { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); max-height: 9.5em; overflow-y: auto; }
  .ev.pick .kind, .ev.pick .body { color: var(--good); }
  .ev.error .kind, .ev.error .body { color: var(--bad); }
  .ev.say .kind { color: var(--good); }
  .follow { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
    header, section.feed { padding-left: 16px; padding-right: 16px; }
    .ev { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<header>
  <h1>Clip Agent</h1>
  <a href="/">← Clip Finder</a>
  <div class="watch" id="watch"></div>
</header>
<div class="layout">
  <aside>
    <div class="start">
      <h2>Run the agent on a video</h2>
      <select id="file"></select>
      <button id="run">Run agent</button>
    </div>
    <h2>Jobs</h2>
    <div class="jobs" id="jobs"><div class="empty">No jobs yet.</div></div>
  </aside>
  <section class="feed">
    <div class="feed-head">
      <h2>Activity</h2>
      <span class="title" id="feedTitle"></span>
      <label class="follow"><input type="checkbox" id="follow" checked> Follow</label>
    </div>
    <div id="feed"><div class="empty">Pick a job, or start one. Videos 4K Video Downloader finishes show up here automatically when the watch folder is set.</div></div>
  </section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const RUNNING = new Set(["queued", "downloading", "transcribing", "scoring"]);
  const KIND_LABEL = { stage: "step", thinking: "thinking", say: "agent", tool: "tool call", result: "result", error: "error" };
  let selected = null;
  let renderedCount = 0;
  let startedAt = null;

  function dotClass(status) {
    return status === "done" ? "done" : status === "error" ? "error" : "running";
  }

  async function loadFiles() {
    const res = await fetch("/local-videos");
    const { videos } = await res.json();
    $("file").innerHTML = videos.length
      ? videos.map((v) => `<option value="${encodeURIComponent(v.path)}">${v.name} (${Math.round(v.minutes)} min)</option>`).join("")
      : `<option value="">No videos in backend/downloads</option>`;
    $("run").disabled = !videos.length;
  }

  async function loadJobs() {
    const res = await fetch("/jobs");
    const { jobs, watch_dir } = await res.json();
    $("watch").innerHTML = watch_dir
      ? `Watching <b>${watch_dir}</b>`
      : `Watch folder off: set CLIPPER_WATCH_DIR in backend/.env`;
    const list = jobs.slice().reverse();
    if (!list.length) return;
    $("jobs").innerHTML = "";
    for (const j of list) {
      const b = document.createElement("button");
      b.className = "job" + (j.job_id === selected ? " active" : "");
      b.innerHTML = `<span class="t"></span><span class="s"><span class="dot ${dotClass(j.status)}"></span>${j.status}${j.agent ? " · agent" : ""}</span>`;
      b.querySelector(".t").textContent = j.title || j.job_id;
      b.addEventListener("click", () => select(j.job_id));
      $("jobs").appendChild(b);
    }
    if (!selected) select(list[0].job_id);
  }

  function select(jobId) {
    if (jobId === selected) return;
    selected = jobId;
    renderedCount = 0;
    startedAt = null;
    $("feed").innerHTML = "";
    document.querySelectorAll(".job").forEach((el) => el.classList.remove("active"));
    loadFeed();
    loadJobs();
  }

  function fmtElapsed(t) {
    const s = Math.max(0, Math.round(t - startedAt));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  async function loadFeed() {
    if (!selected) return;
    const jobId = selected;
    const res = await fetch(`/status/${jobId}`);
    if (!res.ok || jobId !== selected) return;
    const data = await res.json();
    $("feedTitle").textContent = data.title || "";
    const events = data.events || [];
    if (events.length && startedAt === null) startedAt = events[0].t;
    for (const ev of events.slice(renderedCount)) {
      let kind = ev.kind;
      if (kind === "result" && ev.text.startsWith("Selected candidate")) kind = "pick";
      const row = document.createElement("div");
      row.className = `ev ${kind}`;
      row.innerHTML = `<span class="time"></span><span class="kind"></span><span class="body"></span>`;
      row.querySelector(".time").textContent = fmtElapsed(ev.t);
      row.querySelector(".kind").textContent = kind === "pick" ? "picked" : (KIND_LABEL[kind] || kind);
      const body = row.querySelector(".body");
      body.textContent = ev.text;
      // The agent's own messages use **bold**; render just that, on the
      // already-escaped text.
      if (kind === "say" || kind === "thinking") body.innerHTML = body.innerHTML.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      $("feed").appendChild(row);
    }
    if (events.length > renderedCount && $("follow").checked) window.scrollTo(0, document.body.scrollHeight);
    renderedCount = events.length;
  }

  $("run").addEventListener("click", async () => {
    const path = decodeURIComponent($("file").value);
    if (!path) return;
    $("run").disabled = true;
    try {
      const res = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ local_file: path, agent: true }),
      });
      const { job_id } = await res.json();
      await loadJobs();
      select(job_id);
    } finally {
      $("run").disabled = false;
    }
  });

  loadFiles();
  loadJobs();
  setInterval(() => { loadJobs(); loadFeed(); }, 1500);
</script>
</body>
</html>
