[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clippers"
dynamic = ["version"]
description = "Find the short clips worth posting in a long video, frame them for vertical, and send them to DaVinci Resolve or render them as mp4s."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/clippers/assets/fonts/OFL-*.txt"]
requires-python = ">=3.9"
authors = [{ name = "aadedolapo" }]
keywords = ["video", "shorts", "reels", "tiktok", "davinci-resolve", "clips", "whisper", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "anthropic>=0.122",
    "elevenlabs>=2.0",
    "fastapi>=0.110",
    "faster-whisper>=1.0",
    "librosa>=0.10",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "scenedetect>=0.6.4",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.29",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
# Speaker diarization pulls in PyTorch (several GB), so it's opt-in.
diarization = ["pyannote.audio>=3.1,<4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
clippers = "clippers.cli:main"

[project.urls]
Homepage = "https://github.com/aadedolapo/Clippers"
Issues = "https://github.com/aadedolapo/Clippers/issues"

[tool.hatch.version]
path = "src/clippers/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clippers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Long prompt and subtitle-format strings read better unwrapped.
ignore = ["E501"]
